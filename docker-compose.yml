version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000

volumes:
  node_modules:
